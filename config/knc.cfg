# knc.cfg: clang defaults for the Xeon Phi 3120A (Knights Corner). Use with
# clang --config=<this file> --sysroot=<musl sysroot>. See knc.md.
--target=x86_64-unknown-linux-musl
-march=knc
-fcf-protection=none
-fno-jump-tables
-falign-loops=1
-fstack-protector-strong
-fstack-clash-protection
-fPIE
-static-pie
-Wl,-z,relro,-z,now,-z,noexecstack
-fuse-ld=lld
-rtlib=compiler-rt
-unwindlib=none
-stdlib=libc++
